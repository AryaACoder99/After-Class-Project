<!DOCTYPE html>
<html>

<head>
    <title>School Clubs</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .col {
            text-align: center;
            border: 1px black
        }

        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #ff5a4a;
        }

        .school-club {
            text-align: center;
            border: 2px solid color: #ff5a4a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }

        .school-club h3 {
            color: ff5a4a;
        }
    </style>
</head>

<body>
    <h1>School Clubs</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="school-club">
                    <h3>Coding Club</h3>
                    <p>Learn computer coding from experts!</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="school-club">
                    <h3>Science Club</h3>
                    <p>Get to do fun science experiments and learn about science!</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="school-club">
                    <h3>Art Club</h3>
                    <p>Do fun art projects and create masterpeices!</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>
</body>

</html>
